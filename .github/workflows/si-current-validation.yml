name: SI current validation

on:
  push:
    branches:
      - qa/si-current-validation-20260914

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Focused SI suites
        run: |
          python -m pytest -q \
            tests/test_adas_si_research_identity_guard.py \
            tests/test_adas_si_research.py \
            tests/test_research_navigator_vehicle_anchor.py \
            tests/test_research_objective_match_guard.py \
            tests/test_research_dependency_budget_extension.py \
            tests/test_research_semantic_system_guard.py \
            tests/test_research_navigator_agent.py \
            tests/test_research_navigator_binding_and_review.py \
            tests/test_si_research_acceptance_harness.py
      - name: Compile touched SI modules
        run: |
          python -m compileall -q \
            core/services/adas_si_research.py \
            core/services/adas_si_research_vehicle_identity.py \
            core/services/research_navigator_vehicle_anchor.py \
            core/services/research_objective_match_guard.py \
            core/services/research_dependency_budget_extension.py \
            core/services/research_semantic_system_guard.py \
            core/services/research_navigator_agent.py \
            scripts/si_research_acceptance.py
