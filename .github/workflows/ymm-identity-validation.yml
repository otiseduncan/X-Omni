name: YMM identity validation

on:
  push:
    branches:
      - fix/ymm-identity-proof-20260914

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Focused SI suites
        run: |
          python -m pytest -q \
            tests/test_research_ymm_mechanical_anchor.py \
            tests/test_research_navigator_vehicle_anchor.py \
            tests/test_research_navigator_agent.py \
            tests/test_research_navigator_binding_and_review.py \
            tests/test_research_objective_match_guard.py \
            tests/test_research_dependency_budget_extension.py \
            tests/test_adas_si_research_identity_guard.py \
            tests/test_adas_si_research.py
      - name: Compile changed modules
        run: |
          python -m compileall -q \
            core/services/research_ymm_mechanical_anchor.py \
            core/services/research_navigator_vehicle_anchor.py \
            core/services/research_navigator_agent.py
