name: One RO SI validation
on:
  push:
    branches:
      - ro-si-acquire-20260907

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Test one-RO SI acquisition
        run: |
          python -m pytest -q tests/test_calibration_iq_work_prep.py tests/test_calibration_iq_work_prep_orchestrator.py tests/test_prompt_tool_budget.py tests/test_adas_operator_profile.py
          python -m compileall -q core/services/calibration_iq_work_prep.py core/orchestrator/prompt.py core/orchestrator/loop.py
