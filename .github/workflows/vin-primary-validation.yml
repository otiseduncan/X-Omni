name: VIN primary validation

on:
  push:
    branches:
      - fix/vin-primary-ciq-preflight-20260914

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: VIN and CIQ focused suites
        run: |
          python -m pytest -q \
            tests/test_calibration_iq_data_plane_guard.py \
            tests/test_calibration_iq_start_native.py \
            tests/test_calibration_iq_operator.py \
            tests/test_calibration_iq_ro_number_resolution.py \
            tests/test_adas_si_research.py \
            tests/test_adas_si_research_identity_guard.py \
            tests/test_adas_si_research_vin_contract.py \
            tests/test_si_research_acceptance_harness.py
          python -m compileall -q \
            core/services/calibration_iq_data_plane_guard.py \
            core/services/calibration_iq.py \
            core/services/adas_si_research.py \
            scripts/si_vin_preflight.py
