name: ADAS Map VIN handoff validation

on:
  push:
    branches:
      - fix/adas-map-vin-handoff-20260915

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: SI VIN handoff and identity regression suites
        run: |
          python -m pytest -q \
            tests/test_adas_si_research_adas_map_vin_repair.py \
            tests/test_adas_si_research_identity_guard.py \
            tests/test_adas_si_research_vin_contract.py \
            tests/test_adas_si_research.py \
            tests/test_research_navigator_vehicle_anchor.py \
            tests/test_scrapex_service.py \
            tests/test_calibration_iq_data_plane_guard.py
      - name: Compile changed services
        run: |
          python -m compileall -q \
            core/services/__init__.py \
            core/services/adas_si_research.py \
            core/services/adas_si_research_adas_map_vin_repair.py \
            core/services/scrapex.py
