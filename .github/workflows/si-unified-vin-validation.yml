name: Unified SI VIN validation

on:
  push:
    branches:
      - fix/unify-sI-vin-workflow-20260915

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run SI identity and delegated ALLDATA guard regressions
        run: |
          python -m pytest -q \
            tests/test_research_delegate_vin_guard.py \
            tests/test_adas_si_research_adas_map_vin_repair.py \
            tests/test_adas_si_research_identity_guard.py \
            tests/test_adas_si_research_vin_contract.py \
            tests/test_adas_si_research.py \
            tests/test_research_navigator_vehicle_anchor.py
      - name: Compile changed services
        run: |
          python -m compileall -q \
            core/services/__init__.py \
            core/services/research_delegate_vin_guard.py \
            core/services/adas_si_research_adas_map_vin_repair.py
