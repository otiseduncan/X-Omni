name: Phase filter validation
on:
  push:
    branches:
      - phase-filter-hardening-20260907

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validate CIQ phase filtering
        run: |
          python -m pytest -q \
            tests/test_calibration_iq_work_prep.py \
            tests/test_calibration_iq_routing.py \
            tests/test_field_tools.py
          python -m compileall -q core/services/calibration_iq_work_prep.py
