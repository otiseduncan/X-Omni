name: VIN-only SI validation

on:
  push:
    branches:
      - fix/vin-only-si-research-20260915

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: VIN identity and Navigator regression suites
        run: |
          python -m pytest -q \
            tests/test_adas_si_research_identity_guard.py \
            tests/test_adas_si_research_vin_contract.py \
            tests/test_adas_si_research.py \
            tests/test_research_navigator_vehicle_anchor.py \
            tests/test_research_navigator_agent.py \
            tests/test_research_navigator_binding_and_review.py \
            tests/test_research_dependency_budget_extension.py \
            tests/test_research_objective_match_guard.py \
            tests/test_research_semantic_system_guard.py \
            tests/test_si_research_acceptance_harness.py \
            tests/test_calibration_iq_data_plane_guard.py
      - name: Compile touched services
        run: |
          python -m compileall -q \
            core/services/__init__.py \
            core/services/adas_si_research.py \
            core/services/adas_si_research_identity.py \
            core/services/research_navigator_vehicle_anchor.py
      - name: Prove production wiring is VIN-only
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.services import adas_si_research as research

          root = Path('core/services')
          init_text = (root / '__init__.py').read_text(encoding='utf-8')
          assert 'adas_si_research_vehicle_identity' not in init_text
          assert 'research_ymm_mechanical_anchor' not in init_text
          assert not (root / 'adas_si_research_vehicle_identity.py').exists()
          assert not (root / 'research_ymm_mechanical_anchor.py').exists()

          read = {
              'status': 'verified',
              'repair_order': {'RO': '2400911793', 'id': 'ro-gmc', 'vin': None},
              'raw': {
                  'id': 'ro-gmc',
                  'ro_number': '2400911793',
                  'vin': None,
                  'vehicle': {'year': 2014, 'make': 'GMC', 'model': 'Acadia SLE1 FWD'},
                  'calibrations': [
                      {'id': 'cal-sas', 'title': 'Steering Angle Sensor', 'determination': 'REQUIRED'}
                  ],
              },
          }
          assert research.target_from_read(read) is None
          print('VIN-only production wiring verified')
          PY
