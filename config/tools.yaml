# X Omni -- capability gateway policy.
#
# Every tool call is checked here before it runs. The model never
# self-authorizes; its output is a *request* to run a tool, never
# permission to run one.
#
# tiers:
#   read_only        runs immediately, logged
#   operator_authorized runs routine domain actions immediately, logged and verified
#   confirm_required surfaces an approval card in chat, waits for you
#   blocked          never runs, regardless of what asks
#
# A tool with no entry here is BLOCKED (fail closed).

# The active profile controls only which configured capabilities are advertised
# to the conversational model.  It never changes a tool's policy tier or makes
# a hidden capability executable.  `full` remains available for explicit
# maintenance sessions without burdening the normal ADAS field catalog.
default_profile: adas_operator

profiles:
  adas_operator:
    # The model permanently sees four meta-tools. Every other tool listed
    # below stays reachable but is advertised only after a same-turn
    # capability_search unlocks it. The raw Calibration IQ write tools are not
    # in this profile at all: stage_action is the only model-facing write path
    # and expands to them inside the gateway, where the exact-RO write binding,
    # approvals, and receipts still apply. create_ro and create_location cannot
    # be bound to an existing RO, so they stay in the explicit `full` profile.
    description: "Daily ADAS technician surface: query_ciq, delegate_research, stage_action, capability_search."
    permanent:
      - query_ciq
      - delegate_research
      - stage_action
      - capability_search
    tools:
      - query_ciq
      - delegate_research
      - stage_action
      - capability_search
      - get_calendar
      - create_calendar_event
      - list_tasks
      - add_task
      - update_task_status
      - read_file
      - read_attachment
      - list_directory
      - search_files
      - assistant_capabilities_read
      - system_status
      - camera_request
      - exterior_camera_request
      - camera_event_history
      - camera_snapshot_analyze
      - camera_footage
      - adas_si_search
      - adas_si_inventory
      - adas_si_open
      - automotive_knowledge_search
      - automotive_knowledge_read
      - automotive_knowledge_capture
      - calibration_iq_start_native
      - scrapex_status
      - scrapex_start_native
      - scrapex_read
      - scrapex_adas_map

  full:
    description: "Every configured and implemented capability for explicit maintenance use."
    tools: "*"

roots:
  # read_file / list_directory are confined to these. Anything outside
  # is refused even at read_only tier.
  - "X:\\X Omni"
  - "X:\\X 11"
  - "X:\\XV12"
  - "C:\\Users\\otisd\\Projects"
  # ADAS SI: the calibration knowledge base. Full read and write -- see
  # write_roots below.
  - "X:\\ADAS SI"

# Protected writes are intentionally narrower than reads. XV12 is a reference
# checkout for X Omni and must never be changed through the file tool, and
# ADAS SI holds authoritative OEM documents that must never be rewritten.
write_roots:
  - "X:\\X Omni"
  # ADAS SI is Otis's own calibration database, not third-party reference
  # material -- he has full write access to it. Every overwrite is
  # approval-gated and backed up to _xomni_backups\ first.
  - "X:\\ADAS SI"

# The gateway also enforces a non-configurable deny-list for .env* files,
# SQLite DB/WAL/SHM files, credential/token stores, private keys, and private
# identity paths. Adding one of those beneath a root never makes it readable.

tools:
  # ---- Permanent model-facing surface (see profiles.adas_operator.permanent) ----
  query_ciq:
    tier: read_only
    description: "One contract for every Calibration IQ read; the gateway expands it to the exact-RO, board, phase, inventory, or status handler."

  delegate_research:
    tier: operator_authorized
    description: >-
      Bounded multi-source research worker: local ADAS SI, durable knowledge,
      licensed ALLDATA Navigator, public OEM web. Never writes to Calibration IQ;
      preserve=true captures verified evidence into ADAS SI.

  stage_action:
    tier: operator_authorized
    description: >-
      Fresh exact-RO read, then a staged contract or a bound execution through
      the concrete Calibration IQ operator/destructive or ScrapeX acquisition
      tools, each under its own tier, binding, approval, and receipt rules.

  capability_search:
    tier: read_only
    description: "Rank and unlock discoverable profile tools for the rest of the current turn."

  get_weather:
    tier: read_only
    description: "Current conditions and 7-day forecast for the saved location."

  get_calendar:
    tier: read_only
    description: "Read upcoming Google Calendar events."

  list_tasks:
    tier: read_only
    description: "List open tasks and reminders."

  add_task:
    tier: confirm_required
    description: "Add a task or reminder to the local list. Requires approval."

  update_task_status:
    tier: confirm_required
    description: "Mark a task open, in progress, done, or abandoned. Requires approval."

  read_file:
    tier: read_only
    description: "Read a text file inside an allowed root."

  read_attachment:
    tier: read_only
    description: "Read further into a file the operator attached in this conversation."

  list_directory:
    tier: read_only
    description: "List a directory inside an allowed root."

  search_files:
    tier: read_only
    description: "Bounded literal file search inside an allowed read-only root."

  web_research_current:
    tier: read_only
    description: "Live public web search with source-visible, untrusted excerpts."

  website_preview_generate:
    tier: read_only
    description: "Generate a buffered static website and sandboxed inline chat preview; no files or deployment."

  camera_request:
    tier: read_only
    description: "Request an operator-controlled live browser preview in chat; Omni analyzes only explicitly submitted current frames."

  exterior_camera_request:
    tier: read_only
    description: "Request the configured local exterior camera inline; returns safe status and starts nothing until the operator uses the card."

  camera_event_history:
    tier: read_only
    description: "List stored exterior-camera snapshots (baseline and motion events)."

  camera_snapshot_analyze:
    tier: read_only
    description: "Analyze one stored camera snapshot by event id."

  camera_motion_clip:
    tier: read_only
    description: "Assemble a motion event's stored frames into one playable timelapse clip."

  camera_footage:
    tier: read_only
    description: "Render playable continuous or historical exterior-camera footage."

  image_generation_status:
    tier: read_only
    description: "Non-disruptive configured/live status for the separate local ComfyUI worker."

  video_generation_status:
    tier: read_only
    description: "Non-disruptive status for bounded source-preserving local video animation."

  assistant_capabilities_read:
    tier: read_only
    description: "Truthful catalog of currently wired capabilities and limitations."

  system_status:
    tier: read_only
    description: "Active worker, GPU VRAM, health."

  write_file:
    tier: confirm_required
    description: "Create or overwrite a file. Requires approval."

  create_calendar_event:
    tier: confirm_required
    description: "Write an event to Google Calendar. Requires approval."

  run_powershell:
    tier: confirm_required
    description: "Run a PowerShell command. Requires approval."

  image_generate:
    tier: confirm_required
    description: "Generate and persist one local inline image after approval; schedules Omni and ComfyUI sequentially."

  video_generate:
    tier: confirm_required
    description: "Create a verified MP4 from a verified generated PNG using an explicitly selected mode: genuine local Wan2.2 image-to-video or the procedural hover-and-pulse treatment."

  # ---- ADAS SI: the source library is read-only; annotations are gated ----
  adas_si_search:
    tier: read_only
    description: "Search the local authoritative ADAS SI library only. A miss is not acquisition; for an RO SI request use alldata_service_information so the licensed ALLDATA Navigator can continue the job."

  adas_si_inventory:
    tier: read_only
    description: >-
      List ADAS SI documents and the vehicle applications they cover, plus an
      artifact_kind_summary classifying each present document as an ADAS Map
      report or OE service information. Use that summary for document-type
      counts; parsed_document_count in the top-level summary is unrelated
      (filename-identity readability only) and must not be used for that.

  adas_si_open:
    tier: read_only
    description: "Display an ADAS SI document (the real PDF) inline in chat."

  adas_si_file_write:
    tier: confirm_required
    description: "Create or overwrite a file in the ADAS SI library. Backed up first. Requires approval."

  adas_si_records:
    tier: read_only
    description: "List operator-written ADAS SI annotation records."

  adas_si_record_write:
    tier: confirm_required
    description: "Create an ADAS SI annotation record. OEM originals untouched. Requires approval."

  adas_si_record_modify:
    tier: confirm_required
    description: "Update an ADAS SI annotation record. Version-checked. Requires approval."

  # ---- Durable source-backed automotive knowledge ----
  automotive_knowledge_search:
    tier: read_only
    description: >-
      Search durable structured automotive knowledge. Verified, non-superseded
      records are the safe default; an empty result is only a miss in this store,
      not a service-information acquisition result.

  automotive_knowledge_read:
    tier: read_only
    description: >-
      Read one durable automotive knowledge record with its lifecycle, exact
      application, prerequisites, procedures, and source provenance.

  automotive_knowledge_capture:
    tier: operator_authorized
    description: >-
      Preserve source-located candidate automotive knowledge or add evidence to
      an existing record. Model-directed evidence cannot self-verify a claim.

  automotive_knowledge_lifecycle:
    tier: confirm_required
    description: >-
      Promote or supersede durable automotive knowledge with optimistic
      versioning. Requires Owner approval and still fails closed unless the
      repository already contains deterministically validated evidence.

  # ---- Post-collision research: setup is passive, operator use is authorized ----
  research_provider_setup:
    tier: read_only
    description: >-
      ALLDATA account setup/authentication only. Use only for an explicit request
      to configure credentials, sign in, log in, or open the authentication card.
      Never use for SI research or "check ALLDATA"; alldata_service_information
      owns that work. Credentials go directly to Core/Windows Credential Manager
      and never become model arguments or conversation content.

  collision_research:
    tier: operator_authorized
    description: >-
      Backward-compatible targeted post-collision research using licensed ALLDATA
      and public OEM sources. Retained for full-profile maintenance.

  service_information_research:
    tier: operator_authorized
    description: >-
      Backward-compatible general service-information research. Retained for the
      full maintenance profile; not advertised in the normal ADAS operator surface.

  alldata_service_information:
    tier: operator_authorized
    description: >-
      Primary one-RO OEM service-information acquisition. Checks local ADAS SI
      first, then uses ScrapeX's licensed ALLDATA Navigator on a miss or unverified
      result, captures verified procedure evidence, refreshes ADAS SI, and links it
      to Calibration IQ. This capability never acquires or authenticates ADAS Map.

  # ---- ScrapeX: loopback-only ADAS Map acquisition and CIQ reconciliation ----
  scrapex_status:
    tier: read_only
    description: >-
      Read the ScrapeX ADAS Map worker health and managed Work Chrome authentication
      state only. This is not ALLDATA status and does not retrieve service information.

  scrapex_read:
    tier: read_only
    description: >-
      Read ScrapeX ADAS Map batches, exact-RO ADAS Map provenance, exceptions,
      summaries, or a non-mutating Calibration IQ queue preview. Not for ALLDATA SI.

  scrapex_adas_map:
    tier: operator_authorized
    description: >-
      Acquire ADAS Map requirement reports only. This tool never retrieves OEM
      service-information procedures and never opens ALLDATA. ScrapeX verifies
      exact ADAS Map provenance and Calibration IQ reconciliation; authentication
      boundaries apply only to the ADAS Map work-browser profile.

  adas_map_sweep:
    tier: operator_authorized
    description: >-
      Background ADAS Map sweep for a phase/shop scope: CIQ inventory, ScrapeX
      exact batches of the missing ROs, one needs_operator retry, per-RO CIQ
      re-check, result card and push notification. Reached through stage_action
      sweep_adas_maps; not advertised directly in the daily profile.

  adas_map_sweep_status:
    tier: read_only
    description: >-
      Progress or results of the latest ADAS Map sweep. Reached through
      query_ciq kind=adas_map_sweep.

  scrapex_start_native:
    tier: operator_authorized
    description: "Start ScrapeX's local server when unreachable, then verify it answers."

  # ---- Calibration IQ: routine operator work is authorized; destructive deletes are gated ----
  calibration_iq_status:
    tier: read_only
    description: "Is Calibration IQ reachable and is the service token accepted."

  calibration_iq_start_native:
    tier: operator_authorized
    description: "Start Calibration IQ's local stack when unreachable, then verify health."

  calibration_iq_summary:
    tier: read_only
    description: "Count active, all, or authoritative terminal repair orders without listing rows."

  calibration_iq_read:
    tier: read_only
    description: "List one bounded visible subset from a complete active, all, or terminal result."

  calibration_iq_ro:
    tier: read_only
    description: "Display one Calibration IQ repair order in full."

  calibration_iq_update:
    tier: confirm_required
    description: >-
      Change a repair order in Calibration IQ (status, fields, blockers,
      requirements). Idempotency-keyed and version-checked upstream.
      Requires approval.

  calibration_iq_operator:
    tier: operator_authorized
    description: >-
      Perform verified, idempotent Calibration IQ operator batches for the
      active field workflow: research state, photos, ADAS Map/case documents,
      status undo, calibration decisions, and location administration. SI-gap
      bookkeeping and CIQ service-information attachment are dormant.

  calibration_iq_work_prep:
    tier: operator_authorized
    description: >-
      Prepare active Calibration IQ field work from the authoritative RO queue:
      list an explicitly named phase or read/reconcile one RO's governing ADAS Map
      requirements. CIQ service-information coverage/acquisition is dormant.

  calibration_iq_destructive:
    tier: confirm_required
    description: >-
      Remove a calibration requirement, blocker, photo, or general prerequisite
      through explicit backend destructive operations. Requires Owner approval.

  delete_file:
    tier: blocked
    description: "Not available. Deletion stays manual."
